name: SLT Core Tests

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main

jobs:
  core-tests:
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-24.04
          - macos-latest
        python-version:
          - "3.12"
          - "3.13"
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install development environment
        run: |
          python -m pip install -e ".[dev]"

      - name: Ruff
        run: |
          ruff check src tests

      - name: Mypy
        run: |
          mypy src/slt_core

      - name: Pytest
        run: |
          pytest --cov=slt_core --cov-report=term-missing
