[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "slt-bilingual-core"
version = "1.0.0"
description = "Bilingual sign language recognition and translation application (ES/EN)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [
    { name = "Pirrijean", email = "jp.ninor1@uniandes.edu.co" }
]
dependencies = [
    "numpy>=1.24.0",
    "opencv-python>=4.8.0",
    "mediapipe==1.2.2",
    "PySide6>=6.6.0",
    "comtypes>=1.4.0; sys_platform == 'win32'",
    "pyttsx3>=2.90"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0"
]

[project.scripts]
slt = "app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["src"]
