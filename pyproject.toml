[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "slt-bilingual-core"
version = "0.1.0"
description = "Multilingual continuous sign recognition and translation core"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "mypy>=1.13"
]
vision = [
    "mediapipe==1.2.2",
    "av==19.0.2"
]
desktop = [
    "numpy>=1.24.0",
    "opencv-python>=4.8.0",
    "mediapipe==1.2.2",
    "PySide6>=6.6.0",
    "comtypes>=1.4.0; sys_platform == 'win32'",
    "pyttsx3>=2.90"
]

[project.scripts]
slt-desktop = "slt_desktop.main_window:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = [
    "mediapipe.*",
    "cv2.*",
    "av.*",
]
ignore_missing_imports = true
